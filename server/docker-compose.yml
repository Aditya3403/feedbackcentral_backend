version: '3.8'

services:
  feedbackcentral-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=https://feedbackcentral-frontend-mlbh.vercel.app
      - ENVIRONMENT=production
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3